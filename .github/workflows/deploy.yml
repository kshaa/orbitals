name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: |
          mkdir -p dist/node_modules/jquery/dist
          mkdir -p dist/node_modules/three/build
          mkdir -p dist/node_modules/three/examples/js/controls
          mkdir -p dist/node_modules/three/examples/js/exporters
          mkdir -p dist/node_modules/three/examples/js/loaders
          mkdir -p dist/node_modules/dat.gui/build
          
          cp index.html dist/
          cp -r css dist/
          cp -r js dist/
          
          cp node_modules/jquery/dist/jquery.min.js dist/node_modules/jquery/dist/
          cp node_modules/three/build/three.min.js dist/node_modules/three/build/
          cp node_modules/three/examples/js/controls/OrbitControls.js dist/node_modules/three/examples/js/controls/
          cp node_modules/three/examples/js/exporters/OBJExporter.js dist/node_modules/three/examples/js/exporters/
          cp node_modules/three/examples/js/loaders/OBJLoader.js dist/node_modules/three/examples/js/loaders/
          cp node_modules/dat.gui/build/dat.gui.js dist/node_modules/dat.gui/build/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
